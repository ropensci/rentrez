# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ matrix.config.tests && ' + tests' || '' }}

    strategy:
      fail-fast: false
      # Only one job runs the test suite, so the jobs can run together.
      #
      # NCBI issues one API key per user, so every job draws on the same budget
      # of 10 requests a second. One job measured at about 3 a second keyed:
      # rentrez sleeps 0.13s between requests and a request took around 0.2s.
      # Five of those is roughly 15, and a runner closer to NCBI goes higher,
      # with rentrez's own pacing the only floor at 7.7 a second per job (#216).
      #
      # Platforms differ in whether the package builds, installs and checks,
      # and none of that needs the network. Leaving tests to one job holds NCBI
      # load where it already is whatever the runners turn out to do, and the
      # matrix finishes in the time of its slowest job instead of the sum.
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release',  tests: true}
          - {os: macos-latest,   r: 'release',  tests: false}
          - {os: windows-latest, r: 'release',  tests: false}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release', tests: false}
          - {os: ubuntu-latest,  r: 'oldrel-1', tests: false}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # rentrez tests contact the live NCBI EUtils API. An API key raises the
      # rate limit from 3 to 10 requests/second. Add ENTREZ_KEY as a repository
      # secret.
      #
      # GitHub does not pass secrets to pull requests from forks, so those runs
      # see an empty value and fall back to the unauthenticated limit. rentrez
      # treats an empty ENTREZ_KEY as no key, so this degrades rather than breaks.
      ENTREZ_KEY: ${{ secrets.ENTREZ_KEY }}
      # The \donttest{} examples in man/ make live NCBI calls. Running them
      # during R CMD check couples CI to NCBI uptime, so skip them here (CRAN
      # still runs them). The test suite covers the same code paths.
      _R_CHECK_DONTTEST_EXAMPLES_: false

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          args: ${{ matrix.config.tests && 'c("--no-manual", "--as-cran")' || 'c("--no-manual", "--as-cran", "--no-tests")' }}
