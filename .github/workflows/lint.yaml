# Pull requests only. The ruleset on master requires this check, so every
# change passes it before it merges. Two pull requests can still each pass on
# their own and then fail once both are merged, because a branch does not have
# to be up to date with master. prek checks every file, so the next pull
# request catches that.
on:
  pull_request:

name: lint

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx prek run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: no-commit-to-branch
